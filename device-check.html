<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090a0c" />
    <title>PSM Infinity — device check</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        padding: 18px 16px 40px;
        background: #090a0c;
        color: #f4efe6;
        font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        -webkit-font-smoothing: antialiased;
      }
      h1 { font-size: 17px; margin: 0 0 4px; }
      p.sub { margin: 0 0 18px; color: rgba(244, 239, 230, 0.6); font-size: 13px; }
      #verdict {
        font-size: 15px;
        padding: 12px 14px;
        border-radius: 10px;
        margin-bottom: 18px;
        background: #1b1a17;
      }
      #verdict.ok { background: #16301d; color: #b6f0c4; }
      #verdict.bad { background: #3a1717; color: #ffc0c0; }
      table { width: 100%; border-collapse: collapse; }
      td { padding: 7px 0; border-bottom: 1px solid rgba(244, 239, 230, 0.12); vertical-align: top; }
      td:first-child { color: rgba(244, 239, 230, 0.55); width: 44%; }
      td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
      .ok { color: #9fe0ad; }
      .bad { color: #ff9d9d; }
      .warn { color: #f0d69a; }
      h2 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(244, 239, 230, 0.45); margin: 26px 0 6px; }
    </style>
  </head>
  <body>
    <h1>Device check</h1>
    <p class="sub">PSM Infinity film: tier selection, delivery and rendering</p>
    <div id="verdict">running…</div>
    <h2>Device</h2>
    <table id="device"></table>
    <h2>Film</h2>
    <table id="film"></table>
    <h2>Rendering</h2>
    <table id="render"></table>
    <h2>Delivery</h2>
    <table id="delivery"></table>
    <script>
      var SITE = "https://psminfinity.com";
      var rows = function (id, list) {
        document.getElementById(id).innerHTML = list
          .map(function (r) {
            return "<tr><td>" + r[0] + '</td><td class="' + (r[2] || "") + '">' + r[1] + "</td></tr>";
          })
          .join("");
      };
      var ms = function (v) { return Math.round(v) + " ms"; };

      // Must match the bootstrap in index.html and pickTier() in main.js.
      var dpr = Math.min(window.devicePixelRatio || 1, 3);
      var devicePixels = Math.round(window.innerWidth * (window.devicePixelRatio || 1));
      var need = Math.round(window.innerWidth * dpr * 0.85);
      var tier = need <= 720 ? "720" : need <= 1080 ? "1080" : "1280";
      var saveData = navigator.connection && navigator.connection.saveData;

      rows("device", [
        ["model / OS", navigator.userAgent.replace(/^Mozilla\/5\.0 /, "").slice(0, 74)],
        ["viewport", window.innerWidth + " x " + window.innerHeight + " css"],
        ["device pixel ratio", String(window.devicePixelRatio || 1)],
        ["device pixels across", devicePixels + " px"],
        ["save-data", saveData ? "on" : "off"],
        ["reduced motion", matchMedia("(prefers-reduced-motion: reduce)").matches ? "on" : "off"],
      ]);

      rows("film", [
        ["tier this device picks", tier],
        ["scale to screen", (devicePixels / Number(tier)).toFixed(2) + "x"],
        ["expected reel 1 cost", (tier === "720" ? 2.8 : tier === "1080" ? 4.7 : 6.6) + " MB"],
      ]);

      rows("render", [
        ["-webkit-font-smoothing", CSS.supports("-webkit-font-smoothing", "antialiased") ? "supported" : "ignored", CSS.supports("-webkit-font-smoothing", "antialiased") ? "ok" : "warn"],
        ["-webkit-backdrop-filter", CSS.supports("-webkit-backdrop-filter", "blur(4px)") ? "supported" : "missing", CSS.supports("-webkit-backdrop-filter", "blur(4px)") ? "ok" : "warn"],
        ["svg filter (film grade)", CSS.supports("filter", "url(#x)") ? "supported" : "missing", CSS.supports("filter", "url(#x)") ? "ok" : "bad"],
        ["overscroll-behavior", CSS.supports("overscroll-behavior", "none") ? "supported" : "missing", CSS.supports("overscroll-behavior", "none") ? "ok" : "warn"],
      ]);

      function probe(url) {
        return new Promise(function (resolve) {
          var started = performance.now();
          var img = new Image();
          img.decoding = "async";
          var done = function (state) {
            resolve({ ok: state === "load", ms: performance.now() - started, w: img.naturalWidth, h: img.naturalHeight });
          };
          var timer = setTimeout(function () { done("timeout"); }, 15000);
          img.onload = function () { clearTimeout(timer); done("load"); };
          img.onerror = function () { clearTimeout(timer); done("error"); };
          img.src = url;
        });
      }

      (async function () {
        var out = [];
        var failures = 0;
        var versions = "";
        try {
          var html = await (await fetch(SITE + "/?check=" + Date.now(), { cache: "no-store" })).text();
          versions = (html.match(/main\.js\?v=\d+/) || [""])[0] + " / " + (html.match(/styles\.css\?v=\d+/) || [""])[0];
        } catch (err) {
          versions = location.origin === SITE ? "unavailable" : "open this page from psminfinity.com to read";
        }
        out.push(["deployed versions", versions || "unavailable"]);

        var chosen = await probe(SITE + "/assets/frames/" + tier + "/shot-1/000.jpg?v=3");
        if (!chosen.ok) failures += 1;
        out.push([
          "tier " + tier + " frame 0",
          chosen.ok ? ms(chosen.ms) + " · " + chosen.w + "x" + chosen.h : "FAILED",
          chosen.ok ? "ok" : "bad",
        ]);

        for (var i = 0; i < 3; i += 1) {
          var t = ["720", "1080", "1280"][i];
          var res = await probe(SITE + "/assets/frames/" + t + "/shot-1/010.jpg?v=3");
          if (!res.ok) failures += 1;
          out.push([
            "tier " + t + " present",
            res.ok ? res.w + "x" + res.h + " · " + ms(res.ms) : "MISSING",
            res.ok ? "ok" : "bad",
          ]);
        }
        rows("delivery", out);

        var verdict = document.getElementById("verdict");
        if (failures === 0) {
          verdict.className = "ok";
          verdict.textContent = "All checks passed — this device will use the " + tier + " film.";
        } else {
          verdict.className = "bad";
          verdict.textContent = failures + " check(s) failed — see Delivery below.";
        }
      })();
    </script>
  </body>
</html>
